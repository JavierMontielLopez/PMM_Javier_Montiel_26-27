name: aplicacion_prueba
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  url_launcher: ^6.3.2
  readmore: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets\img\foto_mia.jpg
    - assets\img\img_moto1.jpg
    - assets\img\img_moto2.jpg
    - assets\img\img_moto3.jpg
    - assets\img\fotos_montaña.jpg
  fonts:
      - family: Isometra
        fonts:
          - asset: assets/fonts/Isometra-Regular.ttf
  
      - family: EduQLDHand
        fonts:
          - asset: assets/fonts/EduQLDHand-Regular.ttf
